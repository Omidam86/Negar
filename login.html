<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نگار — ورود</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #111111;
      --white: #ffffff;
      --paper: #f4f4f0;
      --paper-2: #e9e9e4;

      --blue: #9bdcff;
      --blue-dark: #4db8ed;
      --yellow: #ffe66d;
      --pink: #ff9ecb;
      --green: #a7f36d;

      --gray: #777777;

      --border: 3px solid var(--black);
      --shadow: 7px 7px 0 var(--black);
      --shadow-small: 4px 4px 0 var(--black);

      --radius: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(
          135deg,
          rgba(0,0,0,.025) 25%,
          transparent 25%
        ) 0 0 / 18px 18px,
        var(--paper);

      color: var(--black);
      font-family: "Vazirmatn", sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 76px;
      background: var(--white);
      border-bottom: var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      text-decoration: none;
      color: var(--black);
    }

    .brand-logo {
      width: 45px;
      height: 45px;

      background: var(--blue);

      border: var(--border);
      box-shadow: var(--shadow-small);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 23px;
      font-weight: 900;

      transform: rotate(-3deg);
    }

    .brand-name {
      font-size: 25px;
      font-weight: 900;
    }

    .back-home {
      border: var(--border);
      background: var(--yellow);

      padding: 10px 16px;

      font-size: 14px;
      font-weight: 800;

      box-shadow: var(--shadow-small);

      text-decoration: none;
      color: var(--black);

      transition: .15s ease;
    }

    .back-home:hover {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--black);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      min-height: calc(100vh - 76px);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 50px 20px;
    }

    .login-wrapper {
      width: min(950px, 100%);

      display: grid;
      grid-template-columns: 1fr 1fr;

      border: var(--border);
      background: var(--white);

      box-shadow: 12px 12px 0 var(--black);
    }

    /* =========================
       LEFT SIDE
    ========================= */

    .intro {
      background: var(--blue);

      border-left: var(--border);

      padding: 50px 42px;

      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      min-height: 530px;
    }

    .intro::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      background: var(--yellow);

      border: var(--border);

      right: -70px;
      top: -60px;

      transform: rotate(18deg);
    }

    .intro::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      background: var(--pink);

      border: var(--border);

      left: -45px;
      bottom: -40px;

      transform: rotate(-12deg);
    }

    .intro-content {
      position: relative;
      z-index: 2;
    }

    .intro-tag {
      display: inline-block;

      background: var(--black);
      color: var(--white);

      padding: 7px 11px;

      font-size: 12px;
      font-weight: 800;

      margin-bottom: 25px;
    }

    .intro h1 {
      font-size: clamp(38px, 5vw, 62px);
      line-height: 1.05;

      font-weight: 900;

      margin-bottom: 22px;
    }

    .intro h1 span {
      display: block;
      background: var(--yellow);

      border: var(--border);

      padding: 4px 10px;

      width: fit-content;

      transform: rotate(-2deg);
    }

    .intro-text {
      max-width: 360px;

      font-size: 16px;
      font-weight: 600;

      line-height: 2;
    }

    .intro-stats {
      position: relative;
      z-index: 2;

      display: flex;
      gap: 12px;

      margin-top: 35px;
    }

    .stat {
      background: var(--white);

      border: var(--border);
      box-shadow: var(--shadow-small);

      padding: 10px 14px;

      font-size: 12px;
      font-weight: 800;
    }

    /* =========================
       LOGIN CARD
    ========================= */

    .login-card {
      padding: 50px 42px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-title {
      font-size: 31px;
      font-weight: 900;

      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--gray);

      font-size: 14px;
      font-weight: 600;

      margin-bottom: 32px;
    }

    /* =========================
       FORM
    ========================= */

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;

      font-size: 13px;
      font-weight: 900;

      margin-bottom: 8px;
    }

    .field input {
      width: 100%;

      height: 52px;

      background: var(--paper);

      border: var(--border);

      padding: 0 14px;

      outline: none;

      font-size: 14px;
      font-weight: 600;

      transition: .15s ease;
    }

    .field input:focus {
      background: var(--yellow);

      box-shadow: var(--shadow-small);

      transform: translate(-2px, -2px);
    }

    .password-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 8px;
    }

    .forgot {
      border: 0;
      background: transparent;

      color: var(--black);

      font-size: 11px;
      font-weight: 800;

      text-decoration: underline;
    }

    .forgot:hover {
      color: var(--blue-dark);
    }

    /* =========================
       CHECKBOX
    ========================= */

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;

      font-size: 12px;
      font-weight: 700;

      margin: 4px 0 24px;
    }

    .remember input {
      width: 18px;
      height: 18px;

      accent-color: var(--black);

      cursor: pointer;
    }

    /* =========================
       LOGIN BUTTON
    ========================= */

    .login-btn {
      width: 100%;
      height: 56px;

      border: var(--border);

      background: var(--black);
      color: var(--white);

      font-size: 15px;
      font-weight: 900;

      box-shadow: var(--shadow);

      transition: .15s ease;
    }

    .login-btn:hover {
      background: var(--blue-dark);

      color: var(--black);

      transform: translate(4px, 4px);

      box-shadow: 3px 3px 0 var(--black);
    }

    .login-btn:active {
      transform: translate(7px, 7px);
      box-shadow: none;
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 30px 0;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 3px;

      background: var(--black);

      flex: 1;
    }

    .divider span {
      font-size: 11px;
      font-weight: 900;
    }

    /* =========================
       REGISTER
    ========================= */

    .register-box {
      border: var(--border);

      background: var(--green);

      padding: 15px;

      text-align: center;

      font-size: 13px;
      font-weight: 800;
    }

    .register-box a {
      color: var(--black);

      font-weight: 900;

      text-decoration: underline;
    }

    /* =========================
       ERROR
    ========================= */

    .error-message {
      display: none;

      background: var(--pink);

      border: var(--border);

      padding: 10px 12px;

      margin-bottom: 18px;

      font-size: 12px;
      font-weight: 800;
    }

    .error-message.show {
      display: block;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 750px) {

      header {
        height: 66px;
        padding: 0 16px;
      }

      .brand-logo {
        width: 39px;
        height: 39px;

        font-size: 19px;
      }

      .brand-name {
        font-size: 21px;
      }

      .back-home {
        padding: 8px 11px;
        font-size: 11px;
      }

      main {
        padding: 25px 14px;
      }

      .login-wrapper {
        grid-template-columns: 1fr;

        box-shadow: 8px 8px 0 var(--black);
      }

      .intro {
        min-height: auto;

        padding: 32px 25px;

        border-left: 0;
        border-bottom: var(--border);
      }

      .intro h1 {
        font-size: 43px;
      }

      .intro-text {
        font-size: 14px;
      }

      .intro-stats {
        margin-top: 25px;
      }

      .stat {
        font-size: 10px;
      }

      .login-card {
        padding: 32px 25px;
      }

      .login-title {
        font-size: 27px;
      }
    }

    @media (max-width: 420px) {

      .intro-stats {
        flex-direction: column;
      }

      .stat {
        width: fit-content;
      }

      .login-wrapper {
        box-shadow: 5px 5px 0 var(--black);
      }

      .login-btn {
        box-shadow: var(--shadow-small);
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <a href="index.html" class="brand">
      <div class="brand-logo">ن</div>
      <div class="brand-name">نگار</div>
    </a>

    <a href="index.html" class="back-home">
      ← بازگشت به خانه
    </a>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <section class="login-wrapper">

      <!-- INTRO -->

      <div class="intro">

        <div class="intro-content">

          <div class="intro-tag">
            شبکه اجتماعی فارسی
          </div>

          <h1>
            دوباره
            <span>برگرد.</span>
          </h1>

          <p class="intro-text">
            وارد نگار شو، پست‌ها رو ببین،
            با بقیه تعامل کن و چیزهایی که
            برات مهمه رو به اشتراک بذار.
          </p>

        </div>


        <div class="intro-stats">

          <div class="stat">
            ساده
          </div>

          <div class="stat">
            سریع
          </div>

          <div class="stat">
            فارسی
          </div>

        </div>

      </div>


      <!-- LOGIN -->

      <div class="login-card">

        <h2 class="login-title">
          ورود به حساب
        </h2>

        <p class="login-subtitle">
          اطلاعاتت رو وارد کن تا ادامه بدیم.
        </p>


        <div id="errorMessage" class="error-message">
          نام کاربری یا رمز عبور اشتباه است.
        </div>


        <form id="loginForm">

          <div class="field">

            <label for="username">
              نام کاربری
            </label>

            <input
              type="text"
              id="username"
              placeholder="مثلاً omid"
              autocomplete="username"
              required
            >

          </div>


          <div class="field">

            <div class="password-row">

              <label for="password">
                رمز عبور
              </label>

              <button
                type="button"
                class="forgot"
                onclick="forgotPassword()"
              >
                رمزمو فراموش کردم
              </button>

            </div>

            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >

          </div>


          <label class="remember">

            <input
              type="checkbox"
              id="remember"
            >

            مرا به خاطر بسپار

          </label>


          <button
            type="submit"
            class="login-btn"
          >
            ورود به نگار ←
          </button>

        </form>


        <div class="divider">
          <span>هنوز حساب نداری؟</span>
        </div>


        <div class="register-box">

          ثبت‌نام در نگار
          <a href="#" onclick="register(event)">
            همین حالا
          </a>

        </div>

      </div>

    </section>

  </main>


  <script>

    /*
      =========================
      LOGIN LOGIC
      =========================

      فعلاً Mock است.
      بعداً همین بخش به Supabase Auth وصل می‌شود.
    */


    const loginForm = document.getElementById("loginForm");
    const errorMessage = document.getElementById("errorMessage");


    loginForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const remember =
        document.getElementById("remember").checked;


      if (!username || !password) {

        showError("لطفاً همه فیلدها را پر کن.");

        return;
      }


      /*
        Mock authentication

        برای تست:
        هر نام کاربری + هر رمز عبوری
        معتبر در نظر گرفته می‌شود.
      */

      localStorage.setItem(
        "negar_logged_in",
        "true"
      );

      localStorage.setItem(
        "negar_username",
        username
      );


      if (remember) {

        localStorage.setItem(
          "negar_remember",
          "true"
        );

      } else {

        localStorage.removeItem(
          "negar_remember"
        );

      }


      window.location.href = "index.html";

    });


    function showError(message) {

      errorMessage.textContent = message;

      errorMessage.classList.add("show");

    }


    function forgotPassword() {

      alert(
        "بخش بازیابی رمز عبور در نسخه بعدی اضافه می‌شود."
      );

    }


    function register(event) {

      event.preventDefault();

      alert(
        "صفحه ثبت‌نام در نسخه بعدی اضافه می‌شود."
      );

    }


    /*
      اگر قبلاً لاگین کرده باشد،
      مستقیماً به خانه برود.
    */

    if (
      localStorage.getItem("negar_logged_in") === "true"
    ) {

      /*
        فعلاً ریدایرکت نمی‌کنیم
        تا صفحه برای تست قابل مشاهده باشد.
      */

    }

  </script>

</body>
</html>
